function drawToJpeg(src, w, h, maxW, quality){
  const scale = Math.min(1, maxW/w);
  const cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round(w*scale));
  cv.height = Math.max(1, Math.round(h*scale));
  cv.getContext("2d").drawImage(src, 0, 0, cv.width, cv.height);
  const out = cv.toDataURL("image/jpeg", quality);
  if(!out || out.length < 100) throw new Error("canvas failed");
  return out;
}
function fileToDataURL(blob){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsDataURL(blob); });
}
async function compressImage(file, maxW, quality){
  let blob = file;
  // 아이폰/갤럭시의 HEIC·HEIF 사진은 JPEG로 자동 변환
  const isHeic = /hei[cf]/i.test(file.type||"") || /\.hei[cf]$/i.test(file.name||"");
  if(isHeic){
    try{
      if(!window.heic2any){
        await new Promise((res,rej)=>{ const s=document.createElement("script");
          s.src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
          s.onload=res; s.onerror=rej; document.head.appendChild(s); });
      }
      let conv = await window.heic2any({blob:file, toType:"image/jpeg", quality:0.85});
      if(Array.isArray(conv)) conv = conv[0];
      blob = conv;
    }catch(e){ /* 변환 실패 시 아래에서 원본으로 한 번 더 시도 */ }
  }
  // 1차: createImageBitmap (대용량 사진에 강함)
  try{
    const bmp = await createImageBitmap(blob);
    const out = drawToJpeg(bmp, bmp.width, bmp.height, maxW, quality);
    bmp.close && bmp.close();
    return out;
  }catch(e){}
  // 2차: <img> 디코딩
  const durl = await fileToDataURL(blob);
  const img = await new Promise((res,rej)=>{ const i=new Image();
    i.onload=()=>res(i); i.onerror=()=>rej(new Error("decode failed")); i.src=durl; });
  return drawToJpeg(img, img.naturalWidth||img.width, img.naturalHeight||img.height, maxW, quality);
}
function cleanTitle(t){
  if(!t) return t;
  return t.replace(/\s*[-|:\u00b7]\s*(YouTube|네이버\s*검색|NAVER|Melon|멜론|Spotify)\s*$/i,"").trim();
}
async function fetchMeta(url){
  const base = { title:hostOf(url), desc:"", image:favicon(url) };
  const h = hostOf(url);
  // 1) 유튜브/스포티파이/비메오는 공식 oEmbed API로 정확한 제목·썸네일을 가져와요
  try{
    let oe = null;
    if(/youtube\.com|youtu\.be/.test(h)) oe = "https://www.youtube.com/oembed?format=json&url="+encodeURIComponent(url);
    else if(/spotify\.com/.test(h)) oe = "https://open.spotify.com/oembed?url="+encodeURIComponent(url);
    else if(/vimeo\.com/.test(h)) oe = "https://vimeo.com/api/oembed.json?url="+encodeURIComponent(url);
    if(oe){
      const r = await fetch(oe);
      if(r.ok){
        const j = await r.json();
        return { title: cleanTitle(j.title)||base.title,
          desc: j.author_name||"",
          image: j.thumbnail_url||base.image };
      }
    }
  }catch(e){}
  // 2) 그 외 사이트는 microlink로 og 이미지·제목을 가져와요
  try{
    const res = await fetch("https://api.microlink.io/?url="+encodeURIComponent(url));
    const j = await res.json();
    if (j.status==="success" && j.data){
      return {
        title: cleanTitle(j.data.title) || base.title,
        desc: j.data.description || j.data.publisher || "",
        image: (j.data.image && j.data.image.url) || (j.data.logo && j.data.logo.url) || base.image
      };
    }
  }catch(e){}
  return base;
}

/* ---------- back button trap (안드로이드 뒤로가기) ---------- */
const Back = {
  stack: [], gen: 0, ignore: 0, inited: false,
  init(){
    if(this.inited) return; this.inited = true;
    window.addEventListener("popstate", ()=>{
      if(this.ignore>0){ this.ignore--; return; }
      const h = this.stack.pop();
      this.gen++;
      if(h) h();
    });
  },
  push(fn){
    this.init(); this.gen++;
    this.stack.push(fn);
    try{ history.pushState({ov:true}, ""); }catch(e){}
  },
  remove(fn){
    const i = this.stack.indexOf(fn);
    if(i<0) return; // 뒤로가기로 이미 닫힌 경우
    this.stack.splice(i,1);
    const g = ++this.gen;
    // 다른 창이 곧바로 열리지 않을 때만 히스토리 정리 (수정 버튼 등 창 전환 시 충돌 방지)
    setTimeout(()=>{
      if(this.gen===g && this.stack.length===0 && history.state && history.state.ov){
        this.ignore++;
        try{ history.back(); }catch(e){}
      }
    }, 80);
  }
};
function BackTrap({onClose}){
  const ref = useRef(onClose); ref.current = onClose;
  useEffect(()=>{
    const fn = ()=>ref.current && ref.current();
    Back.push(fn);
    return ()=>Back.remove(fn);
  },[]);
  return null;
}

function CoupleCard({couple, me, onJoined}){
  const [input,setInput] = useState(""); const [err,setErr] = useState(""); const [copied,setCopied] = useState(false);
  const copy = async ()=>{ try{ await navigator.clipboard.writeText(couple.code);}catch(e){} setCopied(true); setTimeout(()=>setCopied(false),1500); };
  const join = async ()=>{
    setErr("");
    const code = input.trim().toUpperCase();
    if(code.length!==6){ setErr("6자리 코드를 입력해 주세요."); return; }
    if(code===couple.code){ setErr("내 코드가 아니라 상대방의 코드를 입력해야 해요."); return; }
    const q = await db.collection("couples").where("code","==",code).limit(1).get();
    if(q.empty){ setErr("해당 코드를 찾을 수 없어요."); return; }
    const doc = q.docs[0];
    const data = doc.data();
    if((data.members||[]).length>=2){ setErr("이미 두 명이 연결된 코드예요."); return; }
    await doc.ref.update({members: FV().arrayUnion(me.uid)});
    await db.collection("users").doc(me.uid).update({coupleId: doc.id});
    onJoined();
  };
  return <div className="card fade-in" style={{background:"var(--mint-soft)",boxShadow:"none",marginTop:14}}>
    <div className="row"><span style={{fontSize:20}}>🔗</span><b>커플 연결하기</b></div>
    <p className="sub" style={{margin:"6px 0 12px"}}>가입하면 연결 코드가 자동으로 만들어져요. 한 사람이 상대방의 코드를 입력하면 모든 기록을 함께 볼 수 있어요.</p>
    <div className="code-box">
      <div className="sub">내 연결 코드</div>
      <div className="row"><span className="code grow">{couple.code}</span>
        <button className="icon-btn" onClick={copy} aria-label="코드 복사">{I.copy}</button></div>
      {copied && <div className="sub" style={{color:"var(--mint-deep)"}}>복사되었어요!</div>}
    </div>
    <div className="row" style={{marginTop:12}}>
      <input placeholder="상대방 코드 입력" value={input} onChange={e=>setInput(e.target.value.toUpperCase())} maxLength={6} style={{letterSpacing:".15em"}}/>
      <button className="btn btn-mint" style={{width:"auto",whiteSpace:"nowrap"}} onClick={join}>연결</button>
    </div>
    {err && <div className="err">{err}</div>}
  </div>;
}

function Links({cid, me, cat, users}){
  const [items,setItems] = useState([]);
  const [url,setUrl] = useState(""); const [busy,setBusy] = useState(false);
  const [who,setWho] = useState("all"); // all | me | partner
  const [edit,setEdit] = useState(null); // 수정 중인 링크
  const [photoForm,setPhotoForm] = useState(null); // {image, caption}
  const [post,setPost] = useState(null);   // 사진 게시물 상세
  const [zoomP,setZoomP] = useState(null);
  useEffect(()=>db.collection("couples").doc(cid).collection("links")
    .where("cat","==",cat).onSnapshot(s=>{
      const a=[]; s.forEach(d=>a.push({id:d.id,...d.data()}));
      const sv = (it)=> it.order!=null? it.order : -(it.ts||0);
      a.sort((x,y)=> sv(x)-sv(y)); setItems(a);
    }),[cid,cat]);
  useEffect(()=>{ if(post){ const p=items.find(x=>x.id===post.id); setPost(p||null); } },[items]);
  // 드래그로 순서 바꾸기 (버킷리스트와 동일)
  const listRef = useRef(); const dragInfo = useRef(null);
  const [drag,setDrag] = useState(null);
  const startDrag = (e, idx)=>{
    if(who!=="all"){ alert('순서 변경은 "전체" 필터에서 할 수 있어요.'); return; }
    e.preventDefault();
    const rows = [...listRef.current.querySelectorAll(".lk-item")];
    const hs = rows.map(r=>r.offsetHeight+10);
    dragInfo.current = {startY:e.clientY, idx, hs, arr:[...items], cur:idx};
    setDrag({idx, dy:0});
    const move = (ev)=>{
      const info = dragInfo.current; if(!info) return;
      const dy = ev.clientY - info.startY;
      let t = info.idx;
      if(dy>0){ let acc=0; while(t<info.arr.length-1 && dy > acc + info.hs[t+1]/2){ acc+=info.hs[t+1]; t++; } }
      else { let acc=0; while(t>0 && -dy > acc + info.hs[t-1]/2){ acc+=info.hs[t-1]; t--; } }
      if(t!==info.cur){
        const arr=[...info.arr]; const [x]=arr.splice(info.idx,1); arr.splice(t,0,x);
        const [hh]=info.hs.splice(info.idx,1); info.hs.splice(t,0,hh);
        info.preview=arr; info.arr=arr; info.cur=t; info.idx=t; info.startY=ev.clientY;
        setItems(arr); setDrag({idx:t, dy:0});
      } else setDrag(d=>d?{...d,dy}:null);
    };
    const up = ()=>{
      window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up);
      const info=dragInfo.current; dragInfo.current=null; setDrag(null);
      if(info && info.preview){
        const batch = db.batch();
        info.preview.forEach((it,i)=>batch.update(db.collection("couples").doc(cid).collection("links").doc(it.id),{order:(i+1)*10}));
        batch.commit();
      }
    };
    window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
  };
  const userOf = (uid)=>users.find(x=>x.uid===uid);
  const add = async ()=>{
    let u = url.trim(); if(!u) return;
    if(!/^https?:\/\//i.test(u)) u = "https://"+u;
    setBusy(true);
    const meta = await fetchMeta(u);
    await db.collection("couples").doc(cid).collection("links").add({
      cat, url:u, ...meta, by:me.uid, ts:Date.now()
    });
    setUrl(""); setBusy(false);
  };
  const del = (id)=>{ if(confirm("이 링크를 삭제할까요?")) db.collection("couples").doc(cid).collection("links").doc(id).delete(); };
  const savePhoto = async ()=>{
    if(!photoForm.image){ alert("사진을 골라주세요!"); return; }
    await db.collection("couples").doc(cid).collection("links").add({
      cat, type:"photo", image:photoForm.image, title:(photoForm.caption||"").trim(),
      desc:"", url:"", by:me.uid, ts:Date.now()});
    setPhotoForm(null);
  };
  const saveEdit = async ()=>{
    await db.collection("couples").doc(cid).collection("links").doc(edit.id)
      .update({title:edit.title||hostOf(edit.url), desc:edit.desc||"", image:edit.image||""});
    setEdit(null);
  };
  const shown = items.filter(it=> who==="all" ? true : (who==="me" ? it.by===me.uid : it.by!==me.uid));
  const WhoChip = ({it})=>{
    const u = userOf(it.by); const mine = it.by===me.uid;
    return <span className="chip row" style={{gap:4,display:"inline-flex",alignItems:"center",marginTop:4,
      background: mine? "var(--pink-soft)":"var(--lav-soft)", color: mine? "var(--rose)":"#8A6FA8"}}>
      {u&&u.photo ? <img src={u.photo} style={{width:14,height:14,borderRadius:999,objectFit:"cover"}}/> : (mine?"🐹":"🐻")}
      {(u&&u.name)||(mine?"나":"상대방")} 추가
    </span>;
  };
  return <div>
    <div className="row" style={{marginTop:12}}>
      <input placeholder="링크를 붙여넣어 주세요 (유튜브, 스포티파이, 넷플릭스…)" value={url}
        onChange={e=>setUrl(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
      <button className="btn btn-primary" style={{width:"auto",whiteSpace:"nowrap"}} disabled={busy} onClick={add}>{busy?"…":"추가"}</button>
    </div>
    {cat==="etc" && <button className="btn btn-line" style={{width:"100%",marginTop:8,color:"var(--rose)"}}
      onClick={()=>setPhotoForm({image:"",caption:""})}>📷 링크 대신 사진으로 추가하기</button>}
    <div className="row" style={{gap:6,marginTop:10}}>
      {[["all","전체"],["me","내가 추가한 것"],["partner","상대방이 추가한 것"]].map(([k,l])=>
        <button key={k} className="chip" onClick={()=>setWho(k)}
          style={{border:"1.5px solid "+(who===k?"var(--pink-deep)":"var(--line)"),
            background: who===k? "var(--pink-deep)":"#fff", color: who===k? "#fff":"var(--sub)"}}>{l}</button>)}
    </div>
    {shown.length===0 && <p className="sub" style={{textAlign:"center",marginTop:30}}>
      {items.length===0 ? <>아직 담아둔 게 없어요.<br/>같이 보고 싶은 것, 듣고 싶은 것의 링크를 추가해 보세요!</> : "이 필터에 해당하는 항목이 없어요."}</p>}
    <div ref={listRef}>
    {shown.map((it,idx)=> it.type==="photo" ?
      <div key={it.id} className={"card lk-item"+(drag&&drag.idx===idx?" dragging":"")}
        style={{padding:0,overflow:"hidden",marginTop:10, ...(drag&&drag.idx===idx?{transform:"translateY("+drag.dy+"px)"}:{})}}>
        <img src={it.image} style={{width:"100%",display:"block",maxHeight:380,objectFit:"cover",cursor:"pointer"}} onClick={()=>setPost(it)}/>
        <div style={{padding:"10px 14px 12px"}}>
          {it.title && <div style={{fontSize:14,marginBottom:4,whiteSpace:"pre-wrap"}}>{it.title}</div>}
          <div className="row" style={{justifyContent:"space-between"}}>
            <WhoChip it={it}/>
            <span className="row" style={{gap:10}}>
              <button className="sub" onClick={()=>setPost(it)}>💬 {it.cmtCount>0? "댓글 "+it.cmtCount : "댓글"}</button>
              <button className="sub" onClick={()=>setEdit({...it})}>수정</button>
              <button className="sub" onClick={()=>del(it.id)}>삭제</button>
              <span className="handle" onPointerDown={e=>startDrag(e,idx)} aria-label="순서 바꾸기">⠿</span>
            </span>
          </div>
        </div>
      </div>
      :
      <div key={it.id} className={"lk-item"+(drag&&drag.idx===idx?" dragging":"")}
        style={{position:"relative", ...(drag&&drag.idx===idx?{transform:"translateY("+drag.dy+"px)"}:{})}}>
        <a className="linkcard" href={it.url} target="_blank" rel="noreferrer">
          <img src={it.image||favicon(it.url)} onError={e=>{e.target.src=favicon(it.url);}}/>
          <div style={{padding:"10px 66px 10px 0",flex:1}}>
            <div className="t">{it.title}{it.desc && it.desc.length<=24 &&
              <span style={{fontWeight:400,color:"var(--sub)"}}> | {it.desc}</span>}</div>
            {it.desc && it.desc.length>24 && <div className="d">{it.desc}</div>}
            <div className="sub" style={{fontSize:11,marginTop:2}}>{hostOf(it.url)}</div>
            <WhoChip it={it}/>
          </div>
        </a>
        <button className="icon-btn" style={{position:"absolute",top:8,right:42,width:28,height:28}}
          onClick={()=>setEdit({...it})} aria-label="수정">{I.pencil}</button>
        <button className="icon-btn" style={{position:"absolute",top:8,right:8,width:28,height:28}} onClick={()=>del(it.id)} aria-label="삭제">{I.x}</button>
        <span className="handle" style={{position:"absolute",right:12,bottom:6}} onPointerDown={e=>startDrag(e,idx)} aria-label="순서 바꾸기">⠿</span>
      </div>)}
    </div>
    {photoForm && <div className="overlay" onClick={e=>e.target===e.currentTarget&&setPhotoForm(null)}>
      <BackTrap onClose={()=>setPhotoForm(null)}/>
      <div className="sheet">
        <div className="row" style={{justifyContent:"space-between"}}><b style={{fontSize:18}}>사진 추가</b>
          <button className="icon-btn" onClick={()=>setPhotoForm(null)}>{I.x}</button></div>
        {photoForm.image
          ? <div style={{position:"relative",marginTop:12}}>
              <img src={photoForm.image} style={{width:"100%",borderRadius:16,display:"block"}}/>
              <button className="icon-btn" style={{position:"absolute",top:8,right:8,background:"rgba(255,255,255,.92)"}}
                onClick={()=>setPhotoForm({...photoForm,image:""})}>{I.x}</button>
            </div>
          : <button onClick={()=>document.getElementById("etc-photo-file").click()}
              style={{width:"100%",marginTop:12,padding:"34px 0",borderRadius:16,border:"2px dashed var(--pink)",
              color:"var(--rose)",background:"var(--pink-soft)",fontSize:15}}>📷 사진 고르기</button>}
        <input id="etc-photo-file" type="file" accept="image/*" style={{display:"none"}}
          onChange={async e=>{ const f=e.target.files[0];
            if(f){ try{ const b64=await compressImage(f,900,0.65); setPhotoForm(pf=>({...pf,image:b64})); }
              catch(err){ alert("사진을 불러오지 못했어요 😢 다른 사진으로 시도해 보세요."); } }
            e.target.value=""; }}/>
        <div style={{marginTop:12}}><div className="sub" style={{marginBottom:4}}>문구 (선택)</div>
          <input placeholder="사진과 함께 남길 한마디" value={photoForm.caption}
            onChange={e=>setPhotoForm({...photoForm,caption:e.target.value})}/></div>
        <button className="btn btn-primary" style={{marginTop:16}} onClick={savePhoto}>올리기</button>
      </div>
    </div>}
    {post && <div className="overlay" onClick={e=>e.target===e.currentTarget&&setPost(null)}>
      <BackTrap onClose={()=>setPost(null)}/>
      <div className="sheet">
        <div className="row" style={{justifyContent:"space-between"}}>
          <WhoChip it={post}/>
          <button className="icon-btn" onClick={()=>setPost(null)}>{I.x}</button>
        </div>
        <img src={post.image} style={{width:"100%",borderRadius:16,marginTop:10,cursor:"zoom-in",display:"block"}} onClick={()=>setZoomP(post.image)}/>
        {post.title && <p style={{whiteSpace:"pre-wrap",marginTop:10}}>{post.title}</p>}
        <div className="hr"/>
        <CommentThread cid={cid} refKey={["links",post.id]} me={me} users={users}/>
        {zoomP && <Lightbox src={zoomP} onClose={()=>setZoomP(null)}/>}
      </div>
    </div>}
    {edit && <div className="overlay" onClick={e=>e.target===e.currentTarget&&setEdit(null)}>
      <BackTrap onClose={()=>setEdit(null)}/>
      <div className="sheet">
        <div className="row" style={{justifyContent:"space-between"}}><b style={{fontSize:18}}>카드 수정</b>
          <button className="icon-btn" onClick={()=>setEdit(null)}>{I.x}</button></div>
        <p className="sub" style={{margin:"6px 0 0"}}>자동으로 가져온 정보가 마음에 안 들면 직접 고칠 수 있어요.<br/>예: 제목 <b>toxic till the end</b> / 부제 <b>로제 (ROSÉ)</b></p>
        <div style={{marginTop:12}}><div className="sub" style={{marginBottom:4}}>제목</div>
          <input value={edit.title||""} onChange={e=>setEdit({...edit,title:e.target.value})} placeholder="예: toxic till the end"/></div>
        <div style={{marginTop:10}}><div className="sub" style={{marginBottom:4}}>부제 (가수·감독·작가 등)</div>
          <input value={edit.desc||""} onChange={e=>setEdit({...edit,desc:e.target.value})} placeholder="예: 로제 (ROSÉ)"/></div>
        <div style={{marginTop:10}}><div className="sub" style={{marginBottom:4}}>이미지</div>
          <div className="row">
            <button className="btn btn-ghost" style={{whiteSpace:"nowrap"}}
              onClick={()=>document.getElementById("link-img-file").click()}>📷 사진 올리기</button>
            <input id="link-img-file" type="file" accept="image/*" style={{display:"none"}}
              onChange={async e=>{ const f=e.target.files[0]; if(f){ try{ const b64=await compressImage(f,400,0.7); setEdit({...edit,image:b64}); }catch(err){ alert("사진을 불러오지 못했어요 😢 다른 사진으로 시도해 보세요."); } } e.target.value=""; }}/>
            {edit.image && <button className="btn btn-line" style={{whiteSpace:"nowrap",color:"var(--sub)"}}
              onClick={()=>setEdit({...edit,image:""})}>이미지 지우기</button>}
          </div>
          <input value={(edit.image||"").startsWith("data:")? "(올린 사진 사용 중)" : (edit.image||"")}
            readOnly={(edit.image||"").startsWith("data:")}
            onChange={e=>setEdit({...edit,image:e.target.value})}
            placeholder="또는 이미지 주소(URL)를 붙여넣어도 돼요" style={{marginTop:8}}/></div>
        {edit.image && <img src={edit.image} style={{width:80,height:80,objectFit:"cover",borderRadius:12,marginTop:10}} onError={e=>e.target.style.display="none"}/>}
        <button className="btn btn-primary" style={{marginTop:16}} onClick={saveEdit}>저장하기</button>
      </div>
    </div>}
  </div>;
}

/* ---------- Calendar ---------- */
function CalendarView({cid, me, diaries, onWrite, onOpen}){
  const now = new Date();
  const [ym,setYm] = useState([now.getFullYear(), now.getMonth()]);
  const [sel,setSel] = useState(todayStr());
  const [events,setEvents] = useState([]);
  const [evForm,setEvForm] = useState(null); // {date,title,memo}
  const [evDetail,setEvDetail] = useState(null);
  const [y,m] = ym;
  useEffect(()=>db.collection("couples").doc(cid).collection("events")
    .onSnapshot(s=>{ const a=[]; s.forEach(d=>a.push({id:d.id,...d.data()}));
      a.sort((x,y)=>x.date<y.date?-1:1); setEvents(a); }),[cid]);
  useEffect(()=>{ if(evDetail){ const e=events.find(x=>x.id===evDetail.id); setEvDetail(e||null); } },[events]);
  const byDate = useMemo(()=>{ const o={}; diaries.forEach(d=>{ (o[d.date]=o[d.date]||[]).push(d); }); return o; },[diaries]);
  const evByDate = useMemo(()=>{
    const o={};
    events.forEach(ev=>{
      const end = (ev.endDate && ev.endDate>ev.date)? ev.endDate : ev.date;
      let d = new Date(ev.date+"T00:00:00");
      const stop = new Date(end+"T00:00:00");
      let guard = 0;
      while(d<=stop && guard<120){
        const k = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
        (o[k]=o[k]||[]).push(ev);
        d.setDate(d.getDate()+1); guard++;
      }
    });
    return o;
  },[events]);
  const first = new Date(y,m,1); const startDow = first.getDay();
  const dim = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=dim;d++) cells.push(d);
  const key = (d)=> y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  const selList = byDate[sel]||[];
  const selEv = evByDate[sel]||[];
  const upcoming = events.filter(e=> ((e.endDate&&e.endDate>e.date)? e.endDate : e.date) >= todayStr());
  const dday = (e)=>{
    const t = todayStr();
    if(e.date>t){ const n=Math.round((new Date(e.date+"T00:00:00")-new Date(t+"T00:00:00"))/86400000); return "D-"+n; }
    if(e.date===t) return "D-Day";
    return "진행 중";
  };
  const fmtMD = (s)=>{ const p=s.split("-"); return (+p[1])+"월 "+(+p[2])+"일"; };
  const saveEv = async ()=>{
    if(!evForm.title.trim()){ alert("일정 제목을 적어주세요!"); return; }
    if(evForm.endDate && evForm.endDate<evForm.date){ alert("종료 날짜가 시작 날짜보다 빨라요!"); return; }
    const data = {
      date:evForm.date, endDate:(evForm.endDate && evForm.endDate>evForm.date)? evForm.endDate : "",
      title:evForm.title.trim(), memo:(evForm.memo||"").trim()};
    const col = db.collection("couples").doc(cid).collection("events");
    if(evForm.id) await col.doc(evForm.id).update(data);
    else await col.add({...data, by:me.uid, ts:Date.now()});
    setEvForm(null);
  };
  const editEv = (e)=> setEvForm({id:e.id, date:e.date, endDate:e.endDate||"", title:e.title, memo:e.memo||""});
  const delEv = (id)=>{ if(confirm("이 일정을 삭제할까요?")) db.collection("couples").doc(cid).collection("events").doc(id).delete(); };
  return <div className="fade-in">
    <div className="title-xl serif">Calendar</div>
    <div className="card" style={{marginTop:12}}>
      <div className="row" style={{justifyContent:"space-between",marginBottom:8}}>
        <button className="icon-btn" onClick={()=>setYm(m===0?[y-1,11]:[y,m-1])}>‹</button>
        <b className="serif" style={{fontSize:19}}>{y}년 {m+1}월</b>
        <button className="icon-btn" onClick={()=>setYm(m===11?[y+1,0]:[y,m+1])}>›</button>
      </div>
      <div className="cal-grid">
        {["일","월","화","수","목","금","토"].map(w=><div key={w} className="cal-head">{w}</div>)}
        {cells.map((d,i)=>{
          if(d===null) return <div key={"e"+i}/>;
          const k = key(d); const list = byDate[k]||[]; const evs = evByDate[k]||[];
          return <div key={k} className={"cal-cell"+(k===sel?" sel":"")+(k===todayStr()?" today":"")} onClick={()=>setSel(k)}>
            <span className="num">{d}</span>
            <div className="dots">{list.slice(0,3).map((dd,j)=><i key={j} className={dotCls(dd.color!=null? dd.color : j)}/>)}
              {evs.length>0 && <i className="d-ev"/>}</div>
          </div>;
        })}
      </div>
      <div className="row" style={{gap:14,marginTop:6,justifyContent:"center"}}>
        <span className="row sub" style={{gap:5,fontSize:11}}>
          <i style={{width:10,height:5,borderRadius:3,background:"var(--pink)",display:"inline-block"}}/>일기</span>
        <span className="row sub" style={{gap:5,fontSize:11}}>
          <i style={{width:6,height:6,borderRadius:999,background:"var(--blue)",display:"inline-block"}}/>일정</span>
      </div>
    </div>
    <div className="card" style={{marginTop:12}}>
      <div className="row" style={{justifyContent:"space-between"}}>
        <b>{fmtK(sel)} ({dayK(sel)})</b>
        <div className="row" style={{gap:6}}>
          <button className="btn btn-line" style={{padding:"7px 11px",fontSize:13,color:"#49809E"}}
            onClick={()=>setEvForm({date:sel,endDate:"",title:"",memo:""})}>+ 일정</button>
          <button className="btn btn-ghost" style={{padding:"7px 11px",fontSize:13}} onClick={()=>onWrite(sel)}>+ 일기</button>
        </div>
      </div>
      {selEv.map(e=><div key={e.id} className="row" style={{marginTop:10,background:"var(--blue)",borderRadius:14,padding:"10px 12px",cursor:"pointer"}}
        onClick={()=>setEvDetail(e)}>
        <span>📌</span>
        <div className="grow"><b style={{fontSize:14}}>{e.title}</b>
          <div className="sub" style={{color:"#5B7E93"}}>{e.endDate? fmtMD(e.date)+" ~ "+fmtMD(e.endDate) : ""}{e.memo? (e.endDate? " · ":"")+e.memo : ""}</div></div>
        <span className="sub" style={{color:"#5B7E93"}}>›</span>
      </div>)}
      {selList.length===0 && selEv.length===0 && <p className="sub" style={{margin:"12px 0 4px"}}>이 날의 기록이 아직 없어요.</p>}
      {selList.map((d,i)=><div key={d.id} className={"folder "+folderCls(d.color!=null? d.color : i)} style={{cursor:"pointer"}} onClick={()=>onOpen(d)}>
        <span className="tab"></span>
        <b>{d.title||"제목 없음"}</b>
        {d.place && <div className="sub row" style={{gap:4}}>{I.pin}{d.place}</div>}
      </div>)}
    </div>
    <div className="card" style={{marginTop:12}}>
      <b>다가오는 일정 💗</b>
      {upcoming.length===0 && <p className="sub" style={{margin:"10px 0 4px"}}>예정된 데이트가 없어요. 캘린더에서 날짜를 고르고 + 일정을 눌러보세요!</p>}
      {upcoming.map(e=><div key={e.id} className="row" style={{marginTop:10,cursor:"pointer",borderRadius:14,padding:"4px 2px"}}
        onClick={()=>setEvDetail(e)}>
        <span className="chip" style={{background:"var(--blue)",color:"#3F7088",fontWeight:700,minWidth:56,textAlign:"center"}}>{dday(e)}</span>
        <div className="grow"><b style={{fontSize:14}}>{e.title}</b>
          <div className="sub">{fmtK(e.date)} ({dayK(e.date)}){e.endDate? " ~ "+fmtMD(e.endDate)+" ("+dayK(e.endDate)+")" : ""}{e.memo? " · "+e.memo : ""}</div></div>
        <span className="sub">›</span>
      </div>)}
    </div>
    {evDetail && <div className="overlay" onClick={e=>e.target===e.currentTarget&&setEvDetail(null)}>
      <BackTrap onClose={()=>setEvDetail(null)}/>
      <div className="sheet">
        <div className="row" style={{justifyContent:"space-between"}}>
          <span className="chip" style={{background:"var(--blue)",color:"#3F7088",fontWeight:700}}>{dday(evDetail)}</span>
          <button className="icon-btn" onClick={()=>setEvDetail(null)}>{I.x}</button>
        </div>
        <h2 className="serif" style={{margin:"10px 0 4px",fontSize:22}}>📌 {evDetail.title}</h2>
        <div className="sub">{fmtK(evDetail.date)} ({dayK(evDetail.date)}){evDetail.endDate? " ~ "+fmtK(evDetail.endDate)+" ("+dayK(evDetail.endDate)+")" : ""}</div>
        {evDetail.memo && <p style={{whiteSpace:"pre-wrap",marginTop:12}}>{evDetail.memo}</p>}
        <div className="row" style={{gap:8,marginTop:20}}>
          <button className="btn btn-ghost grow" onClick={()=>{ editEv(evDetail); setEvDetail(null); }}>수정</button>
          <button className="btn btn-line grow" style={{color:"#D65C5C"}}
            onClick={async ()=>{ if(confirm("이 일정을 삭제할까요?")){
              await db.collection("couples").doc(cid).collection("events").doc(evDetail.id).delete();
              setEvDetail(null); } }}>삭제</button>
        </div>
      </div>
    </div>}
    {evForm && <div className="overlay" onClick={e=>e.target===e.currentTarget&&setEvForm(null)}>
      <BackTrap onClose={()=>setEvForm(null)}/>
      <div className="sheet">
        <div className="row" style={{justifyContent:"space-between"}}><b style={{fontSize:18}} className="serif">{evForm.id? "일정 수정" : "일정 추가"}</b>
          <button className="icon-btn" onClick={()=>setEvForm(null)}>{I.x}</button></div>
        <div style={{marginTop:12}}><div className="sub" style={{marginBottom:4}}>시작 날짜</div>
          <input type="date" value={evForm.date} onChange={e=>setEvForm({...evForm,date:e.target.value})}/></div>
        <div style={{marginTop:10}}><div className="sub" style={{marginBottom:4}}>종료 날짜 (선택 · 하루 일정이면 비워두세요)</div>
          <input type="date" value={evForm.endDate} onChange={e=>setEvForm({...evForm,endDate:e.target.value})}/></div>

function DiaryView({cid, me, users, diaries, editorDate, clearEditorDate, openId, clearOpenId}){
  const [view,setView] = useState("list");
  const [q,setQ] = useState("");
  const [zoom,setZoom] = useState(null);   // {p, d}
  const [editor,setEditor] = useState(null);   // null | {entry?, date?}
  const [detail,setDetail] = useState(null);   // diary object
  useEffect(()=>{ if(editorDate){ setEditor({date:editorDate}); clearEditorDate(); } },[editorDate]);
  useEffect(()=>{ if(openId){ const d=diaries.find(x=>x.id===openId); if(d) setDetail(d); clearOpenId(); } },[openId,diaries]);
  useEffect(()=>{ if(detail){ const d=diaries.find(x=>x.id===detail.id); setDetail(d||null); } },[diaries]);

  const filtered = useMemo(()=>{
    const s = q.trim().toLowerCase();
    if(!s) return diaries;
    return diaries.filter(d=>(d.title||"").toLowerCase().includes(s)
      ||(d.place||"").toLowerCase().includes(s)
      ||(d.content||"").toLowerCase().includes(s));
  },[q,diaries]);
  // 월별 그룹 (최신 월이 위)
  const groups = useMemo(()=>{
    const m = {};
    filtered.forEach(d=>{ const k=(d.date||"").slice(0,7)||"기타"; (m[k]=m[k]||[]).push(d); });
    return Object.entries(m).sort((a,b)=> a[0]<b[0]? 1 : -1);
  },[filtered]);
  const [openM,setOpenM] = useState(null); // null = 최신 월만 자동으로 열림
  const toggleMonth = (mk)=>{
    const base = openM? new Set(openM) : new Set(groups.length? [groups[0][0]] : []);
    base.has(mk)? base.delete(mk) : base.add(mk);
    setOpenM(base);
  };
  const photos = useMemo(()=>filtered.flatMap(d=>(d.photos||[]).map(p=>({p,d}))),[filtered]);

  return <div className="fade-in">
    <div className="row" style={{justifyContent:"space-between"}}>
      <div><div className="title-xl serif">Diary</div><div className="sub">우리가 함께한 날들</div></div>
      <div className="row" style={{gap:6}}>
        <button className={"icon-btn"+(view==="list"?" on":"")} onClick={()=>setView("list")} aria-label="목록형으로 보기">{I.list}</button>
        <button className={"icon-btn"+(view==="album"?" on":"")} onClick={()=>setView("album")} aria-label="앨범형으로 보기">{I.grid}</button>
      </div>
    </div>
    <div className="row" style={{marginTop:12}}>
      <div style={{position:"relative"}} className="grow">
        <span style={{position:"absolute",left:12,top:9,color:"var(--sub)",width:20,height:20,display:"inline-block"}}>{I.search}</span>
        <input placeholder="제목·장소·내용 검색" value={q} onChange={e=>setQ(e.target.value)} style={{paddingLeft:38}}/>
      </div>
      <button className="btn btn-primary" style={{width:"auto",whiteSpace:"nowrap"}} onClick={()=>setEditor({date:todayStr()})}>+ 쓰기</button>
    </div>

    {view==="list" ? <>
      {filtered.length===0 && <p className="sub" style={{textAlign:"center",marginTop:36}}>
        {q? "검색 결과가 없어요." : "첫 데이트 일기를 남겨보세요! 🌸"}</p>}
      {groups.map(([mk, list], gi)=>{
        const open = q.trim()? true : (openM? openM.has(mk) : gi===0);
        const [gy,gm] = mk.split("-");
        return <div key={mk}>
          <button className="row" style={{width:"100%",marginTop:12,background:"#fff",borderRadius:14,
            padding:"10px 14px",boxShadow:"var(--shadow)",textAlign:"left"}} onClick={()=>toggleMonth(mk)}>
            <b className="serif" style={{fontSize:15}}>{+gy}년 {+gm}월</b>
            <span className="chip" style={{background:"var(--pink-soft)",color:"var(--rose)"}}>{list.length}</span>
            <span className="grow"/>
            <span className="sub">{open? "▾" : "▸"}</span>
          </button>
          {open && list.map((d,i)=><div key={d.id} className={"folder "+folderCls(d.color!=null? d.color : i)} style={{cursor:"pointer"}} onClick={()=>setDetail(d)}>
            <span className="tab"></span>
            <div className="sub">{fmtK(d.date)} ({dayK(d.date)})</div>
            <b style={{fontSize:16}}>{d.title||"제목 없음"}</b>
            {d.place && <div className="sub row" style={{gap:4}}>{I.pin}{d.place}</div>}
            {(d.photos&&d.photos.length>0) && <div className="pgrid" style={{marginTop:10}}>
              {d.photos.slice(0,3).map((p,j)=><img key={j} src={p}/>)}
            </div>}
            {d.content && <p style={{margin:"8px 0 0",fontSize:14,color:"#6E645C",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden"}}>{d.content}</p>}
          </div>)}

function DiaryEditor({cid, me, init, close}){

  const [color,setColor] = useState(e0.color!=null? e0.color : 0);
  const [busy,setBusy] = useState(false);
  const fileRef = useRef();
  const addPhotos = async (files)=>{
    const arr=[...photos];
    for(const f of files){
      if(arr.length>=6){ alert("사진은 한 일기에 최대 6장까지 넣을 수 있어요."); break; }
      try{ arr.push(await compressImage(f, 800, 0.55)); }
      catch(e){ alert('"'+(f.name||"사진")+'" 파일을 불러오지 못했어요 😢\n다른 사진으로 시도해 보거나, 카카오톡 안에서 열었다면 Chrome/Safari 브라우저로 열어서 시도해 주세요.'); }
    }
    setPhotos(arr);
  };
  const save = async ()=>{
    if(!title.trim() && !content.trim()){ alert("제목이나 내용을 적어주세요!"); return; }
    const data = {date,title:title.trim(),place:place.trim(),content,photos,color,by:me.uid,ts:e0.ts||Date.now()};

    setBusy(true);
    const col = db.collection("couples").doc(cid).collection("diaries");
    if(e0.id) await col.doc(e0.id).set(data,{merge:true});
    else await col.add(data);
    setBusy(false); close();
  };
  const CCOLS = ["var(--pink)","var(--mint)","var(--butter)","var(--lav)"];
  return <div className="overlay" onClick={e=>e.target===e.currentTarget&&close()}>
    <BackTrap onClose={close}/>
    <div className="sheet">
      <div className="row" style={{justifyContent:"space-between"}}>
        <b style={{fontSize:18}} className="serif">{e0.id?"일기 수정":"일기 쓰기"}</b>
        <button className="icon-btn" onClick={close}>{I.x}</button>
      </div>
      <div style={{marginTop:12}}><div className="sub" style={{marginBottom:4}}>날짜</div>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
      <div style={{marginTop:10}}><div className="sub" style={{marginBottom:4}}>제목</div>
        <input placeholder="오늘의 데이트를 한 마디로" value={title} onChange={e=>setTitle(e.target.value)}/></div>
      <div style={{marginTop:10}}><div className="sub" style={{marginBottom:4}}>장소</div>
        <input placeholder="어디에 다녀왔나요?" value={place} onChange={e=>setPlace(e.target.value)}/></div>
      <div style={{marginTop:10}}><div className="sub" style={{marginBottom:4}}>카드 색상</div>
        <div className="row" style={{gap:10}}>
          {CCOLS.map((cc,i)=><button key={i} aria-label={"색상 "+(i+1)}
            onClick={()=>setColor(i)}
            style={{width:30,height:30,borderRadius:999,background:cc,flexShrink:0,
              border: color===i? "3px solid var(--pink-deep)" : "2px solid #fff",
              boxShadow:"0 2px 6px rgba(120,90,80,.18)"}}/>)}
        </div></div>
      <div style={{marginTop:10}}><div className="sub" style={{marginBottom:4}}>일기</div>
        <textarea placeholder="오늘 함께한 시간들을 기록해요…" value={content} onChange={e=>setContent(e.target.value)}/></div>
      <div style={{marginTop:10}}>
        <div className="sub" style={{marginBottom:6}}>사진 ({photos.length}/6)</div>
        <div className="pgrid">
          {photos.map((p,i)=><div key={i} style={{position:"relative"}}>
            <img src={p}/>
            <button className="icon-btn" style={{position:"absolute",top:4,right:4,width:26,height:26,background:"rgba(255,255,255,.9)"}}
              onClick={()=>setPhotos(photos.filter((_,j)=>j!==i))}>{I.x}</button>
          </div>)}
          {photos.length<6 && <button onClick={()=>fileRef.current.click()}
            style={{aspectRatio:"1",borderRadius:12,border:"2px dashed var(--pink)",color:"var(--rose)",
            display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4,background:"var(--pink-soft)"}}>

    </div>
  </div>;

/* ---------- Bucket list (check + drag reorder) ---------- */
function BucketView({cid, me}){
  const [items,setItems] = useState([]);
  const [text,setText] = useState("");
  const [drag,setDrag] = useState(null); // {idx, dy}
  const listRef = useRef(); const dragInfo = useRef(null);
  useEffect(()=>db.collection("couples").doc(cid).collection("bucket")
    .onSnapshot(s=>{ const a=[]; s.forEach(d=>a.push({id:d.id,...d.data()}));
      a.sort((x,y)=>(x.order||0)-(y.order||0)); setItems(a); }),[cid]);
  const add = async ()=>{
    if(!text.trim()) return;
    const maxOrder = items.reduce((m,i)=>Math.max(m,i.order||0),0);
    await db.collection("couples").doc(cid).collection("bucket").add({text:text.trim(),done:false,order:maxOrder+10,by:me.uid,ts:Date.now()});
    setText("");
  };
  const toggle = (it)=> db.collection("couples").doc(cid).collection("bucket").doc(it.id).update({done:!it.done});
  const del = (it)=>{ if(confirm("삭제할까요?")) db.collection("couples").doc(cid).collection("bucket").doc(it.id).delete(); };

  const persistOrder = async (arr)=>{
    const batch = db.batch();
    arr.forEach((it,i)=>batch.update(db.collection("couples").doc(cid).collection("bucket").doc(it.id),{order:(i+1)*10}));
    await batch.commit();
  };
  const onHandleDown = (e, idx)=>{
    e.preventDefault();
    const rows = [...listRef.current.querySelectorAll(".bk")];
    const rowH = rows[idx].offsetHeight + 8;
    dragInfo.current = {startY:e.clientY, idx, rowH, arr:[...items]};
    setDrag({idx, dy:0});
    const move = (ev)=>{
      const info = dragInfo.current; if(!info) return;
      const dy = ev.clientY - info.startY;
      const shift = Math.round(dy/info.rowH);
      let target = Math.min(info.arr.length-1, Math.max(0, info.idx+shift));
      if(target !== info.curTarget){
        info.curTarget = target;
        const arr = [...info.arr];
        const [x] = arr.splice(info.idx,1);
        arr.splice(target,0,x);
        info.preview = arr;
        setItems(arr);
        setDrag({idx:target, dy:0});
        info.startY = ev.clientY; info.idx = target; info.arr = arr;
      } else {
        setDrag(d=>d?{...d, dy}:null);
      }
    };
    const up = ()=>{
      window.removeEventListener("pointermove",move);
      window.removeEventListener("pointerup",up);
      const info = dragInfo.current; dragInfo.current=null;
      setDrag(null);
      if(info && info.preview) persistOrder(info.preview);
    };
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up);
  };
  const done = items.filter(i=>i.done).length;
  return <div className="fade-in">
    <div className="title-xl serif">Bucket List</div>
    <div className="sub">함께 이루고 싶은 것들 · {done}/{items.length} 달성 💗</div>
    <div className="row" style={{marginTop:12}}>
      <input placeholder="예: 벚꽃 보러 가기 🌸" value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
      <button className="btn btn-primary" style={{width:"auto",whiteSpace:"nowrap"}} onClick={add}>추가</button>
    </div>
    <div ref={listRef} style={{marginTop:6}}>
      {items.map((it,idx)=>
        <div key={it.id} className={"bk"+(it.done?" done":"")+(drag&&drag.idx===idx?" dragging":"")}
          style={drag&&drag.idx===idx?{transform:`translateY(${drag.dy}px)`}:{}}>
          <button className="box" onClick={()=>toggle(it)} aria-label="달성 체크">{it.done?"✓":""}</button>
          <span className="txt grow">{it.text}</span>
          <button className="sub" style={{fontSize:11}} onClick={()=>del(it)}>삭제</button>
          <span className="handle" onPointerDown={e=>onHandleDown(e,idx)} aria-label="순서 바꾸기">⠿</span>
        </div>)}
    </div>
    {items.length===0 && <p className="sub" style={{textAlign:"center",marginTop:30}}>둘이서 하고 싶은 일들을 하나씩 적어보세요.<br/>달성하면 체크! 순서는 ⠿를 잡고 옮길 수 있어요.</p>}
  </div>;
}

function AccountView({me, userDoc, couple, users, refresh, cid}){

    }catch(e){ setUsage(-1); }
  })(); },[cid]);
  const [nick,setNick] = useState(userDoc.name||"");
  const [msg,setMsg] = useState(""); const [err,setErr] = useState("");
  const [curPw,setCurPw] = useState(""); const [newPw,setNewPw] = useState("");
  const fileRef = useRef();
  const isPwUser = me.providerData.some(p=>p.providerId==="password");
  const saveNick = async ()=>{
    await db.collection("users").doc(me.uid).update({name:nick.trim()||"이름 없음"});
    setMsg("닉네임을 저장했어요."); setTimeout(()=>setMsg(""),2000); refresh();
  };
  const changePhoto = async (f)=>{
    try{
      const b64 = await compressImage(f, 300, 0.7);
      await db.collection("users").doc(me.uid).update({photo:b64});
      refresh();
    }catch(e){ alert("사진을 불러오지 못했어요 😢 다른 사진으로 시도해 보세요."); }
  };
  const changePw = async ()=>{
    setErr(""); setMsg("");
    try{
      const cred = firebase.auth.EmailAuthProvider.credential(me.email, curPw);
      await me.reauthenticateWithCredential(cred);
      await me.updatePassword(newPw);
      setMsg("비밀번호를 변경했어요."); setCurPw(""); setNewPw("");
    }catch(e){ setErr(korErr(e)); }
  };
  const partner = users.find(u=>u.uid!==me.uid);
  return <div className="fade-in">
    <div className="title-xl serif">Account</div>
    <div className="card" style={{marginTop:12}}>
      <div className="row">
        <button onClick={()=>fileRef.current.click()} style={{position:"relative"}}>
          {userDoc.photo? <img className="avatar" src={userDoc.photo}/> : <div className="avatar">🐹</div>}
          <span className="icon-btn" style={{position:"absolute",bottom:-4,right:-4,width:26,height:26}}>{I.camera}</span>
        </button>
        <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}}
          onChange={e=>{ if(e.target.files[0]) changePhoto(e.target.files[0]); e.target.value=""; }}/>
        <div className="grow">
          <b style={{fontSize:17}}>{userDoc.name}</b>
          <div className="sub">{me.email}</div>
          <div className="chip" style={{background:"var(--lav-soft)",color:"#8A6FA8",marginTop:4}}>
            {isPwUser? "이메일 로그인":"Google 로그인 연결됨"}</div>
        </div>
      </div>
      <div className="hr"/>
      <div className="sub" style={{marginBottom:4}}>닉네임</div>
      <div className="row"><input value={nick} onChange={e=>setNick(e.target.value)}/>
        <button className="btn btn-ghost" style={{whiteSpace:"nowrap"}} onClick={saveNick}>저장</button></div>
    </div>

    <div className="card" style={{marginTop:12}}>
      <b>커플 연결</b>
      {partner
        ? <div className="row" style={{marginTop:10}}>
            {partner.photo? <img className="avatar" src={partner.photo} style={{width:44,height:44}}/> : <div className="avatar" style={{width:44,height:44,fontSize:20}}>🐻</div>}
            <div className="grow"><b>{partner.name}</b><div className="sub">연결 완료 💗</div></div>
          </div>
        : <CoupleCard couple={couple} me={me} onJoined={refresh}/>}
    </div>

    <div className="card" style={{marginTop:12}}>
      <b>저장 공간 📦</b>
      {usage===null && <div className="sub" style={{marginTop:8}}>계산 중…</div>}
      {usage===-1 && <div className="sub" style={{marginTop:8}}>사용량을 불러오지 못했어요.</div>}
      {usage>=0 && (()=>{
        const GB = 1073741824;
        const pct = Math.min(100, usage/GB*100);
        const mb = (usage/1048576).toFixed(1);
        return <>
          <div style={{background:"var(--line)",borderRadius:999,height:10,marginTop:12,overflow:"hidden"}}>
            <div style={{width:pct.toFixed(1)+"%",minWidth:pct>0?"4px":"0",height:"100%",borderRadius:999,
              background: pct>80? "#E88888" : "var(--pink-deep)"}}/>
          </div>
          <div className="row" style={{justifyContent:"space-between",marginTop:6}}>
            <span className="sub">{mb} MB 사용 중</span>
            <span className="sub">무료 제공 약 1GB의 {pct<0.1? "0.1% 미만" : pct.toFixed(1)+"%"}</span>
          </div>
          <div className="sub" style={{marginTop:6}}>사진은 자동 압축되어 저장돼요. 80%가 넘어가면 알려주세요 — 사진 저장 방식을 무료 외부 저장소로 넓혀드릴 수 있어요.</div>
        </>;
      })()}
    </div>

    <div className="card" style={{marginTop:12}}>
      <b>테마 컬러 🎨</b>
      <div className="sub" style={{marginTop:2}}>앱 전체 색감을 골라보세요 (나에게만 적용돼요)</div>
      <div className="row" style={{gap:10,marginTop:12,flexWrap:"wrap"}}>
        {Object.entries(THEMES).map(([k,t])=>{
          const on = (userDoc.theme||"pink")===k;
          return <button key={k} title={t.name} aria-label={t.name}
            onClick={async ()=>{ applyTheme(t); await db.collection("users").doc(me.uid).update({theme:k}); refresh(); }}
            style={{width:36,height:36,borderRadius:999,background:t.pink,flexShrink:0,
              border: on? "3px solid "+t.deep : "2px solid #fff",
              boxShadow:"0 2px 8px rgba(120,90,80,.18)"}}/>;
        })}
      </div>
      <div className="sub" style={{marginTop:8}}>현재: {THEMES[userDoc.theme||"pink"].name}</div>
    </div>

    {isPwUser && <div className="card" style={{marginTop:12}}>
      <b>비밀번호 변경</b>
      <input type="password" placeholder="현재 비밀번호" value={curPw} onChange={e=>setCurPw(e.target.value)} style={{marginTop:10}}/>
      <input type="password" placeholder="새 비밀번호 (6자 이상)" value={newPw} onChange={e=>setNewPw(e.target.value)} style={{marginTop:8}}/>
      <button className="btn btn-primary" style={{marginTop:12}} onClick={changePw}>변경하기</button>
    </div>}
    {msg && <div className="sub" style={{color:"var(--mint-deep)",marginTop:10}}>{msg}</div>}
    {err && <div className="err">{err}</div>}
    <button className="btn btn-line" style={{width:"100%",marginTop:16,color:"var(--sub)"}} onClick={()=>auth.signOut()}>로그아웃</button>
  </div>;
}

/* ---------- Shell ---------- */
const NAV = [
  {id:"interests", label:"Interests", icon:I.heart},
  {id:"calendar", label:"Calendar", icon:I.cal},
  {id:"diary", label:"Diary", icon:I.book},
  {id:"bucket", label:"Bucket", icon:I.check},
  {id:"account", label:"Account", icon:I.user}
];
function Shell({me}){
  const [userDoc,setUserDoc] = useState(null);
  const [couple,setCouple] = useState(null);
  const [users,setUsers] = useState([]);
  const [tab,setTab] = useState("diary");
  const [diaries,setDiaries] = useState([]);
  const [editorDate,setEditorDate] = useState(null);
  const [openId,setOpenId] = useState(null);
  const [tick,setTick] = useState(0);
  const [emojiOpen,setEmojiOpen] = useState(false);
  const [notiOpen,setNotiOpen] = useState(false);
  const refresh = ()=>setTick(t=>t+1);

  // ensure user & couple docs
  useEffect(()=>{
    (async ()=>{
      const uref = db.collection("users").doc(me.uid);
      const snap = await uref.get();
      let u = snap.exists? snap.data() : null;
      if(!u || !u.coupleId){
        const cref = await db.collection("couples").add({code:genCode(), members:[me.uid], ts:Date.now()});
        u = {name:(u&&u.name)||me.displayName||"이름 없음", email:me.email, photo:(u&&u.photo)||me.photoURL||"", coupleId:cref.id};
        await uref.set(u,{merge:true});
      } else if((!u.name || u.name==="이름 없음") && me.displayName){
        // 구글 계정 이름으로 자동 보정
        await uref.update({name: me.displayName});
        u = {...u, name: me.displayName};
      }
      setUserDoc({uid:me.uid,...u});
    })();
  },[me.uid,tick]);

  // subscribe couple + members
  useEffect(()=>{
    if(!userDoc) return;
    const un = db.collection("couples").doc(userDoc.coupleId).onSnapshot(async s=>{
      const c = {id:s.id,...s.data()};
      setCouple(c);
      const ms = c.members||[];
      const arr = [];
      for(const uid of ms){
        const d = await db.collection("users").doc(uid).get();
        arr.push({uid, ...(d.data()||{})});
      }
      arr.sort((a,b)=>a.uid===me.uid?-1:1);
      setUsers(arr);
    });
    return un;
  },[userDoc&&userDoc.coupleId, tick]);

  // apply saved color theme
  useEffect(()=>{ const t = userDoc && THEMES[userDoc.theme]; if(t) applyTheme(t); },[userDoc && userDoc.theme]);

  // subscribe profiles (Interests의 프로필 이름을 닉네임 대신 쓸 수 있게)
  const [profMap,setProfMap] = useState({});
  useEffect(()=>{
    if(!userDoc) return;
    return db.collection("couples").doc(userDoc.coupleId).collection("profiles")
      .onSnapshot(s=>{ const o={}; s.forEach(d=>o[d.id]=d.data()); setProfMap(o); });
  },[userDoc&&userDoc.coupleId]);
  // 닉네임이 비어있거나 "이름 없음"이면 → Interests 프로필 이름으로 대체
  const usersM = useMemo(()=>users.map(u=>{
    const noName = !u.name || u.name==="이름 없음";
    const pn = profMap[u.uid] && profMap[u.uid].name;
    return noName && pn ? {...u, name: pn} : u;
  }),[users,profMap]);

  // subscribe diaries
  useEffect(()=>{
    if(!userDoc) return;
    return db.collection("couples").doc(userDoc.coupleId).collection("diaries")
      .onSnapshot(s=>{ const a=[]; s.forEach(d=>a.push({id:d.id,...d.data()}));
        a.sort((x,y)=> x.date===y.date ? (y.ts||0)-(x.ts||0) : (x.date<y.date?1:-1)); setDiaries(a); });
  },[userDoc&&userDoc.coupleId]);

  // 일기 탭을 보면 "확인함"으로 기록 → 새 글/댓글 배지 계산에 사용
  useEffect(()=>{
    if(tab==="diary" && userDoc){
      const now = Date.now();
      db.collection("users").doc(me.uid).update({seenDiary: now}).catch(()=>{});
      setUserDoc(u=> u? {...u, seenDiary: now} : u);
    }
  },[tab, diaries]);

  if(!userDoc || !couple) return <div className="wrap" style={{paddingTop:120,textAlign:"center"}}>
    <div className="logo" style={{fontSize:34}}>date<span className="a">:a</span></div>
    <div className="sub">불러오는 중…</div></div>;

  const solo = (couple.members||[]).length<2;
  const cid = userDoc.coupleId;
  const seen = userDoc.seenDiary||0;
  const hasNew = tab!=="diary" && diaries.some(d=>
    ((d.ts||0)>seen && d.by!==me.uid) ||
    ((d.lastCmt||0)>seen && d.lastCmtBy && d.lastCmtBy!==me.uid));
  // 앱 내 알림 목록 (상대방의 새 일기·댓글)
  const nameOfM = (uid)=>{ const u=usersM.find(x=>x.uid===uid); return u? (u.name||"상대방") : "상대방"; };
  const notis = diaries.flatMap(d=>{
    const a=[];
    if(d.by!==me.uid && d.ts) a.push({t:d.ts, type:"diary", id:d.id,
      msg: nameOfM(d.by)+"님이 새 일기를 작성했어요", sub: (d.title||"제목 없음")+" · "+fmtK(d.date)});
    if(d.lastCmtBy && d.lastCmtBy!==me.uid && d.lastCmt) a.push({t:d.lastCmt, type:"cmt", id:d.id,
      msg: nameOfM(d.lastCmtBy)+"님이 댓글을 남겼어요", sub: d.title||fmtK(d.date)});
    return a;
  }).sort((x,y)=>y.t-x.t).slice(0,30);
  const seenN = userDoc.seenNoti||0;
  const unreadN = notis.filter(n=>n.t>seenN).length;
  const openNoti = ()=>{
    setNotiOpen(true);
    const now = Date.now();
    db.collection("users").doc(me.uid).update({seenNoti: now}).catch(()=>{});
    setUserDoc(u=> u? {...u, seenNoti: now} : u);
  };
  return <>
    <div className="wrap">
      <div className="row" style={{justifyContent:"space-between",marginBottom:6}}>
        <span className="logo" style={{fontSize:22}}>date<span className="a">:a</span></span>
        <span className="row" style={{gap:8}}>
          <button className="icon-btn" style={{width:30,height:30,position:"relative"}} onClick={openNoti} aria-label="알림">
            {I.bell}
            {unreadN>0 && <span className="ndot" style={{top:1,right:1}}/>}
          </button>
          <span className="sub row" style={{gap:4}}>{userDoc.name}{solo && " · 연결 대기중"}
            <button onClick={()=>setEmojiOpen(true)} aria-label="이모지 변경"
              style={{fontSize:17,lineHeight:1,padding:"2px 4px"}}>{userDoc.emoji||"💗"}</button></span>
        </span>
      </div>
      {solo && tab!=="account" && <div style={{marginBottom:10}}>
        <CoupleCard couple={couple} me={me} onJoined={refresh}/>
      </div>}
      {tab==="interests" && <Interests cid={cid} me={me} users={usersM} couple={couple}/>}
      {tab==="calendar" && <CalendarView cid={cid} me={me} diaries={diaries}
        onWrite={d=>{setEditorDate(d); setTab("diary");}}
        onOpen={d=>{setOpenId(d.id); setTab("diary");}}/>}
      {tab==="diary" && <DiaryView cid={cid} me={me} users={usersM} diaries={diaries}
        editorDate={editorDate} clearEditorDate={()=>setEditorDate(null)}
        openId={openId} clearOpenId={()=>setOpenId(null)}/>}
      {tab==="bucket" && <BucketView cid={cid} me={me}/>}
      {tab==="account" && <AccountView me={me} userDoc={userDoc} couple={couple} users={usersM} refresh={refresh} cid={cid}/>}
    </div>
    <nav className="nav">
      {NAV.map(n=><button key={n.id} className={tab===n.id?"on":""} onClick={()=>setTab(n.id)}>
        {n.icon}<span>{n.label}</span>
        {n.id==="diary" && hasNew && <span className="ndot"/>}
      </button>)}
    </nav>
    {notiOpen && <div className="overlay" onClick={e=>e.target===e.currentTarget&&setNotiOpen(false)}>
      <BackTrap onClose={()=>setNotiOpen(false)}/>
      <div className="sheet">
        <div className="row" style={{justifyContent:"space-between"}}><b style={{fontSize:18}}>알림 🔔</b>
          <button className="icon-btn" onClick={()=>setNotiOpen(false)}>{I.x}</button></div>
        {notis.length===0 && <p className="sub" style={{textAlign:"center",marginTop:26}}>아직 알림이 없어요.<br/>상대방이 일기나 댓글을 쓰면 여기에 떠요!</p>}
        {notis.map((n,i)=><button key={n.id+"-"+n.type+"-"+n.t} className="row"
          style={{width:"100%",textAlign:"left",background: n.t>seenN? "var(--pink-soft)":"#fff",
            borderRadius:14,padding:"11px 13px",marginTop:8,boxShadow:"var(--shadow)"}}
          onClick={()=>{ setOpenId(n.id); setTab("diary"); setNotiOpen(false); }}>
          <span style={{fontSize:19}}>{n.type==="diary"? "📖" : "💬"}</span>
          <div className="grow">
            <div style={{fontSize:14}}>{n.msg}</div>
            <div className="sub">{n.sub} · {relTime(n.t)}</div>
          </div>
        </button>)}
      </div>
    </div>}
    {emojiOpen && <div className="overlay" onClick={e=>e.target===e.currentTarget&&setEmojiOpen(false)}>
      <BackTrap onClose={()=>setEmojiOpen(false)}/>
      <div className="sheet">
        <div className="row" style={{justifyContent:"space-between"}}><b style={{fontSize:18}}>내 이모지 고르기</b>
          <button className="icon-btn" onClick={()=>setEmojiOpen(false)}>{I.x}</button></div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:6,marginTop:14}}>
          {EMOJIS.map(em=><button key={em} onClick={async ()=>{
              await db.collection("users").doc(me.uid).update({emoji:em});
              setUserDoc(u=>({...u,emoji:em})); setEmojiOpen(false); }}
            style={{fontSize:26,padding:"9px 0",borderRadius:12,
              background:(userDoc.emoji||"💗")===em? "var(--pink-soft)":"transparent"}}>{em}</button>)}
        </div>
      </div>
    </div>}
  </>;
}

function App(){
  const [user,setUser] = useState(undefined);
  useEffect(()=>auth.onAuthStateChanged(u=>setUser(u)),[]);
  if(user===undefined) return <div className="wrap" style={{paddingTop:120,textAlign:"center"}}>
    <div className="logo" style={{fontSize:34}}>date<span className="a">:a</span></div></div>;
  return user? <Shell me={user}/> : <AuthScreen/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(CONFIG_OK? <App/> : <SetupNotice/>);

if ("serviceWorker" in navigator && CONFIG_OK){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
